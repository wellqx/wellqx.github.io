<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="wellqx — Creative Developer / Interactive Design. Minecraft mods, web apps and interactive experiments.">

<body data-page="top">

  <header class="l-header">
    <div class="l-header__inner">
      <nav class="l-header__nav l-header__nav--left" aria-label="Primary">
        <div class="item">

        <div class="item">

      </nav>

      <div class="l-header__logo">

      </div>

      <nav class="l-header__nav l-header__nav--right" aria-label="Secondary">
        <div class="item">
          <a href="/playground/" class="item__link">PLAYGROUND</a>

        <div class="item has-dropdown">
          <button class="item__link contact" type="button" aria-expanded="false" aria-label="Contact">CONTACT</button>

            <div class="innerlink__item">
              <a href="https://github.com/wellqx" target="_blank" rel="noopener">GITHUB</a>
            </div>
          </div>
        </div>
      </nav>

      <div class="l-header__menu-sp">
        <div class="item has-dropdown">
          <button class="item__link menu" type="button" aria-expanded="false" aria-label="Menu">MENU</button>
          <div class="innerLink innerLink--menu">
            <div class="innerlink__item"><a href="/projects/">PROJECTS</a></div>
            <div class="innerlink__item"><a href="/about/">ABOUT</a></div>
            <div class="innerlink__item"><a href="/playground/">PLAYGROUND</a></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="c-tempo">
    <p class="c-tempo__text">
      <span id="js-tempo-time" data-city="MOSCOW">—</span><br>
      <span>...</span>
    </p>
  </div>

  <div class="c-heading">
    <p class="c-heading__text">
      <span class="c-heading__line">wellqx<span class="cam">.</span></span>
      <span class="c-heading__line">portfolio</span>
    </p>
  </div>

  <div id="nyan-loader" aria-hidden="true">MEOW MEOW</div>
  <div id="intro-counter" class="is-empty" aria-hidden="true">
    <span id="intro-counter__num">000</span>
  </div>
  <div id="reaction-hud" aria-hidden="true">
    <p id="reaction-prompt">LIGHTS OUT, PRESS SHIFT!</p>
    <p id="reaction-result">
      <span id="reaction-time"></span>
      <span id="reaction-label"></span>
    </p>
  </div>

  <main class="l-main">
    <div class="l-main__inner">
      <div class="c-title">
        <div class="c-title__inner">
          <h1 class="c-title__name" id="js-hero-name">wellqx<span class="accent">.</span></h1>
          <p class="c-title__sub" id="js-hero-sub">Creative Developer / Interactive Design</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="l-footer">
    <div class="l-inner">
      <div class="switcher" role="group" aria-label="Lights out" data-lights-idle id="js-lights-btn">
        <button class="switcher__toggle" type="button" aria-label="Toggle lights">
          <span class="switcher__thumb" aria-hidden="true"></span>
        </button>

        <div class="sns__item">
          <a href="https://github.com/wellqx" target="_blank" rel="noopener">

    </div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/webgl.js"></script>
  <script src="/assets/js/reaction.js"></script>
  <script src="/assets/js/intro.js"></script>

</html>
